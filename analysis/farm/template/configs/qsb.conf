# qsb -- the s62 QS-B verdict-mix sweep.  PORT of analysis/farm/qsb_{ship,fetch}.sh
# + qsb_shim.py (frozen legacy, still tracked at analysis/farm/).
#
# WHAT THIS SWEEP IS.  QS-B was SPECIFIED in s56 but never run until s62: the
# decisions/second curve and the UNSAT FRACTION as a function of instance size
# (xR), measured over the chain corpus at a fixed per-cell time limit.
#
# THE HAZARD SPECIFIC TO THIS INSTRUMENT: an UNSAT is a NORMAL, EXPECTED result
# -- it IS most of the product -- so an UNSAT must NEVER banner.  Only a SAT
# does, and a SAT here is a cover of an OPEN n=7 chain, i.e. a 5905 world-record
# candidate.  qsbsweep routes every print through its own say() guard, which
# rewrites any healthy line that would match the supervisor's alarm scan.
#
# SHARD SILENCE: qsbsweep emits ONE progress row per UNIT (one solver call), so
# a shard is silent for at most one solver call (--time-limit, 30 s at the
# queue's budget) plus ~0.01 s instance build.  STALL_MINUTES 10 is therefore
# ~20x the true worst-case gap -- stated explicitly so the number is a decision,
# not a default.  (Contrast a0: one CELL per shard, one 600 s silence, 20.)
#
# *** DEEP PARITY IS NOT YET PORTED.  qsb_env.ps1 carries an instrument-specific
# probe that makes the PC redraw the Mac's SAMPLE STREAM, rebuild six pinned
# instances, compare each instance SHA, and re-solve for verdict+node parity
# (the refutation lane is deterministic, so a verdict mismatch means a different
# engine or a different instance).  The generic regex rows below prove the
# import chain resolves farm-side and nothing more.  RUN `qsb_env.ps1` (frozen,
# tracked) BEFORE ANY QS-B LAUNCH. ***

TAG=qsb
WHAT="s62 QS-B verdict mix: decisions/s and UNSAT fraction vs instance size"
ADAPTER=qsb_adapter.py
INSTRUMENT=analysis/counting/s62/qsbsweep.py

FILES=(
  analysis/counting/s62/qsbsweep.py
  pylib/__init__.py
  pylib/p1a_assume.py
  pylib/dlxrun.py
  pylib/chain7.py
  pylib/prefixlib.py
  analysis/farm/farm_chains.jsonl
)
PROVENANCE=( out/s59/cliff/qsb.py )
EXTRA=(
  ../extraDocs/superpermutation-examples/scripts/gain1.py
  ../extraDocs/superpermutation-examples/scripts/certificate.py
)

SHARDS=24          # 24 on 28 cores leaves 4 for the transcription service
WORKERS=24
MB_PER_SHARD=300
TOTAL=3600
STALL_MINUTES=10

EXTRA_ARGS="--time-limit 30"
DRYRUN_ARGS="--time-limit 30"

FETCH_DEST=out/s62/farm
PRODUCT_GLOB='word_*.txt'
STATS_GLOB='*_stats_*.tsv'
GATE_CMDS=(
  "python3 analysis/counting/m3_check.py -n 7 <f>"
  "cargo run --release -q -- validate -n 7 --file <f> --complete"
)
PRODUCT_NOTE="A SAT here is a cover of an OPEN n=7 chain -- a 5905 WORLD-RECORD candidate.  Gate on the MAC, in order: confirm_sat -> validate -n 7 --complete -> m3_check.py -n 7 (exit 2 = novel).  Do not celebrate, do not publish, do not let anything overwrite the product."
SCOPE_NOTE="UNSAT is the expected bulk of the product here (the sweep MEASURES the UNSAT fraction); a timeout is UNKNOWN, never a negative."

LAUNCH_NOTES="BEFORE LAUNCH: run the frozen deep-parity check as well --
  powershell ... -File F:\\superpermFarm\\untargeted\\qsb_env.ps1
(sample-stream + six instance SHAs + verdict/node parity vs the Mac; not yet
expressible as generic parity rows)."
