# a0 -- the s62 A0 gate sweep.  PORT of analysis/farm/a0_{ship,fetch}.sh +
# a0_shim.py (frozen legacy, still tracked at analysis/farm/).
#
# WHAT THIS SWEEP IS.  It re-runs the s56 "A0 gate" -- can dlx7g find a cover
# from the CHAIN ALONE, with no atom assumptions -- at a REAL time budget.
# s56's "0/6" was measured at a 15 s cap (out/s59/cliff/REPORT.md §7 flags it),
# so "no engine finds a cover from the chain alone" is not citable until this
# runs.  Grid: 6 control instances x 3 runs (1 seed at eps=0, 2 seeds at
# eps=0.15) = 18 cells, sharded 18 ways, ONE CELL PER SHARD.
#
# THE ENGINE IS NOT REBUILT.  s58_ship.sh built dlx7g.exe from the repo's own
# analysis/trackc/dlx7g.c into the shared repo mirror, and A0's verdicts ARE
# that engine's verdicts.  farm_env.ps1's parity rows confirm it is present;
# they never rebuild it, because a rebuild risks a different binary under the
# same claim.
#
# ---------------------------------------------------------------- MANIFEST --
# Derived by IMPORTING the instrument chain and reading sys.modules, plus an
# audit hook on `open` to catch data files -- NOT by guessing:
#   a0gate.py -> p1a_assume -> {certificate, gain1, chain7}
#             -> dlxrun     -> (subprocess only: dlx7g.exe)
#   data actually opened: exactly the six PANEL words of out/s59/cliff/geninst.py
# (Post-s64-P1 the middle of that chain resolves through pylib/, so the package
# files ship instead of the out/sNN originals.)
#
# *** DEEP PARITY IS NOT YET PORTED.  a0_env.ps1 carries an instrument-specific
# probe that makes the PC rebuild all six A0 instances and compares each one's
# column/row SHA against a Mac-computed table, plus a dlxrun eps-lane check.
# That is real parity and the generic regex rows below are NOT a substitute:
# they prove the import chain resolves farm-side, nothing more.  RUN
# `a0_env.ps1` (frozen, tracked) BEFORE ANY A0 LAUNCH. ***

TAG=a0
WHAT="s62 A0 gate: 6 controls x 3 runs (eps 0 / 0.15), TL 600s"
ADAPTER=a0_adapter.py
INSTRUMENT=analysis/counting/s62/a0gate.py

FILES=(
  analysis/counting/s62/a0gate.py
  pylib/__init__.py
  pylib/p1a_assume.py
  pylib/dlxrun.py
  pylib/chain7.py
  pylib/prefixlib.py
  data/upstream5906/5906.up-02d771908307.txt
  data/novel5906c/5906.rbnd-2641d60c9d5c.txt
  data/upstream5906/5906.up-331228e22360.txt
  data/upstream5906/5906.up-6f42b3603dac.txt
  data/upstream5906/5906.up-0a065898a821.txt
  data/upstream5907/5907.up-6f2e8d9df51c.txt
)
# Shipped for a human to diff; MUST NEVER be imported -- geninst.py builds
# instances and calls sys.exit() at MODULE level, which would kill a shard.
PROVENANCE=( out/s59/cliff/geninst.py )
# Lives OUTSIDE the repo; pylib.add_legacy_paths() puts <repo>\..\extraDocs\...
# on sys.path, which is where farm_ship.sh lands these.
EXTRA=(
  ../extraDocs/superpermutation-examples/scripts/gain1.py
  ../extraDocs/superpermutation-examples/scripts/certificate.py
)

SHARDS=18          # 18 on 28 cores leaves 10 for the transcription service
WORKERS=18
MB_PER_SHARD=300
TOTAL=18
# NOT the default 10: one shard = ONE cell, so a shard is legitimately silent
# for the whole 600 s solver call plus instance build.  At the default every
# healthy shard would be flagged STALL.
STALL_MINUTES=20

EXTRA_ARGS="--time-limit 600"
DRYRUN_ARGS="--time-limit 600"

FETCH_DEST=out/s62/farm
PRODUCT_GLOB='word_*.txt'
STATS_GLOB='*_stats_*.tsv'
GATE_CMDS=(
  "python3 analysis/counting/m3_check.py -n 7 <f>"
  "cargo run --release -q -- validate -n 7 --file <f> --complete"
)
PRODUCT_NOTE="A SAT on any control is a cover found from the chain alone -- a FINDABILITY event, NOT a new record.  A0 is known-SAT by construction and the chain pins length = 5764 + (K+R), so the cover compiles to a word the SAME length as its source (5906, or 5907 on that control).  It is a 5905 candidate only if the compiled length actually comes out < 5906, which a0gate.py tests and banners separately.  An UNSAT would be a soundness CONTRADICTION, not a result.  Gate on the MAC: confirm_sat -> validate -n 7 --complete -> m3_check.py -n 7."
SCOPE_NOTE="A TIMEOUT IS UNKNOWN, NEVER A NEGATIVE.  The whole point of the re-run is that s56's '0/6' was 15 s of UNKNOWN misread as a field fact."

LAUNCH_NOTES="BEFORE LAUNCH: run the frozen deep-parity check as well --
  powershell ... -File F:\\superpermFarm\\untargeted\\a0_env.ps1
(six instance SHAs vs the Mac + the dlxrun eps lane; not yet expressible as
generic parity rows)."
