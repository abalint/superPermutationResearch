[package]
name = "superperm"
version = "0.1.0"
edition = "2021"
description = "Superpermutation search research: permutation graph, greedy baseline, beam search, rollout data generator, validator."

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
