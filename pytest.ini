[pytest]
# s64 P2 — the Python control suite (docs/REFACTOR-BRIEF.md §3 P2).
#
#   python3 -m pytest tests_py/            # default (fast) tier
#   python3 -m pytest tests_py/ -m slow    # the heavy tier only
#   scripts/check.sh                       # cargo test --release + the fast tier
#
# `addopts` deselects `slow` by default; a CLI `-m ...` is parsed after
# addopts and wins, so `-m slow` selects exactly the heavy tier.
testpaths = tests_py
python_files = test_*.py
addopts = -m "not slow" -q
markers =
    slow: heavy control (tens of seconds to minutes) or one that rewrites
        durable s63 state (the fixture backs it up and restores it).
        Deselected by default; run with `-m slow`.
