# mc28 -- the s63 v=28 supply-tight FOREST multi-cover sweep (the (140,8,0,0,0)
# cell).  PORT of analysis/farm/mc28_{ship,fetch}.sh + mc28_env.ps1 + mc28_shim.py
# (the s63 proving quartet, kept tracked and frozen at analysis/farm/).
#
# WHAT THIS SWEEP IS.  docs/SWEEP-QUEUE.md's n=6 midgame j-probe (s62) PART 1 as
# RESHAPED by out/s63/mcover/REPORT.md §9.  length <= 872 with j >= 1 forces
# R = 9, and R >= K = #phi-cycles with K even and K >= 8 forces K = 8, which
# holds IFF the loop-cycle incidence graph is a FOREST (REPORT §6) -- so
# --forest is a SOUND restriction, not a heuristic, and the whole cell is
# decided by enumerating FOREST multi-covers.
#
# THE PAYLOAD IS FOUR FILES AND NOTHING ELSE.  mcover_search.py imports only
# cover_search.build and lib62.weight and opens no data file, so there is no
# import-chain archaeology and no corpus to ship (verified by import audit).
# NOTHING IS BUILT: no compiled engine, and the PC has no Rust toolchain -- so
# the alarm-path GATE cannot run there.  Any find comes home and is gated on the
# Mac (see GATE_CMDS below).
#
# STATUS: NOT LAUNCHED.  N_forest(28) > 4.2M at s63 close with the enumeration
# still running; the 3M gate was breached and Andrew's decision is pending.

TAG=mc28
WHAT="s63 (140,8,0,0,0) cell: v=28 splits=20 supply-tight FOREST multi-covers, TMAX 872 j>=1"
ADAPTER=mc28_adapter.py
INSTRUMENT=pylib/mcover_search.py

FILES=(
  pylib/mcover_search.py
  pylib/cover_search.py
  pylib/lib62.py
  pylib/farmstatus.py
)
SCRIPTS_EXTRA=( "${TPL}/configs/mc28.gate.md" )

# The enumerated cover stream: emitted ONCE on the Mac (`--emit-covers`), shipped
# gzipped, body sha256 + declared total verified BY EVERY SHARD before it
# processes a line (engine exits 4 otherwise).  The manifest sha and the in-band
# sha are two independent ends of the same check.
SIDEFILES=( "out/s63/mcover/covers_v28_forest.txt:covers_v28_forest.txt" )

SHARDS=24          # 24 on 28 cores leaves 4 for the transcription service
WORKERS=24
MB_PER_SHARD=300
TOTAL=24
# -StallMinutes 20 with --tick 100, sized from measurement not taste: per-cover
# cost on the FARM is 0.315 s (200 covers in 63 s), so one STATUS tick is
# 100 x 0.315 = ~32 s, and that cadence is independent of N.  Shard startup
# silence is negligible (sha-verify streams 107 MB in 0.3 s; tables build in
# 1.2 s) so the first tick lands ~35-40 s in.  20 min is ~37x the healthy gap
# while still catching a wedged shard inside 20 minutes of an 11-hour run.
# DO NOT raise --tick without raising STALL_MINUTES with it.
STALL_MINUTES=20

EXTRA_ARGS="-n 6 --tmax 872 --v 28 --splits 20 --jmin 1 --forest --covers-file F:\\superpermFarm\\untargeted\\covers_v28_forest.txt --tick 100"
# The DRY smoke sizes from --total-covers instead of the (multi-hundred-MB)
# cover stream: identical to the s63 mc28dry2 parity smoke, which read
# 24/24 DONE with shard 0 sizing 8586 covers / 43 ticks at --tick 200.
DRYRUN_ARGS="-n 6 --tmax 872 --v 28 --splits 20 --jmin 1 --forest --total-covers 206043 --tick 200"

FETCH_DEST=out/s63/mcover/farm
PRODUCT_GLOB='mc28-s*-j*.txt'
STATS_GLOB='stats_s*.tsv'
# The engine's own banners that invalidate a negative.  A capped shard's
# "NO walk" is NOT a negative -- the engine says so itself and exits 3.
PARTIAL_MARKERS='PARTIAL (cap hit)|NOT SUPPLY-TIGHT'
GATE_CMDS=(
  "cargo run --release -q -- validate -n 6 --file <f> --complete"
  "python3 analysis/counting/m3_check.py <f>"
  "python3 pylib/verify_master.py 6 <f>"
)
PRODUCT_NOTE="A gated product here is a materialized j >= 1 n=6 walk of length <= 872 in the (140,8,0,0,0) cell.  Nothing like it exists.  Stop and report.  verify_master exit 1 = THEORY ALARM."

SCOPE_NOTE="Scope, state it with the claim: PURE walks (no intra-cycle edge of weight >= 2), supply-TIGHT only (S = 5v), sound GIVEN the phi-cycle law of out/s63/mcover/REPORT.md §6 (K = v-splits iff the loop-cycle incidence graph is a forest), which is what licenses --forest.  Supply-SLACK cells are untouched."

ENV_ARGS="-Full"
LAUNCH_NOTES="LAUNCH GATE (2026-08-01, Andrew, in SWEEP-QUEUE): N_forest(28) must be
EXACT (emit finished, trailer present) and <= 3,000,000.  Above that -> STOP.
A PARTIAL count is a lower bound and sizes nothing.  BREACHED at s63 close
(> 4.2M, still enumerating) -- decision pending, DO NOT LAUNCH.

THE GATE IS IN *MAC* CORE-HOURS.  Measured by the -Full parity row: the
200-cover real-branch parity ran 63 s on the farm vs 33 s on the Mac, so this
box is 1.91x SLOWER PER CORE.  Per-cover ~0.17 s Mac / ~0.325 s farm:
    farm core-hours  = N_forest x 0.325 s / 3600
    wall (24 shards) = N_forest x 0.325 s / 24"
